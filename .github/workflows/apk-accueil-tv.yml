name: APK Accueil TV

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/apk-accueil-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Clé de signature personnelle (facultative) : secrets du dépôt GitHub.
      # Sans eux, la clé partagée android/app/accueil-partage.jks est utilisée.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # Adresse du serveur Lexia intégrée à l'APK (variable du dépôt, facultative) :
      # Settings → Secrets and variables → Actions → Variables → LEXIA_SERVEUR = tv.votre-domaine.fr
      LEXIA_SERVEUR: ${{ vars.LEXIA_SERVEUR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../AccueilTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AccueilTV
          path: AccueilTV.apk
      # Lien fixe pour Downloader :
      # https://github.com/<owner>/<repo>/releases/download/accueil-tv/AccueilTV.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: accueil-tv
          target_commitish: ${{ github.sha }}
          name: Accueil TV (dernière version)
          body: |
            Application Fire TV qui ouvre l'écran d'accueil des voyageurs au démarrage,
            quand la TV se rallume, et en économiseur d'écran.
            Compilée depuis le commit ${{ github.sha }}.
          make_latest: false
          files: AccueilTV.apk
