name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LexiaPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LexiaPlayer-apk
          path: LexiaPlayer.apk
      # Lien de téléchargement fixe, utilisable directement dans Downloader sur la Fire TV :
      # https://github.com/<owner>/<repo>/releases/latest/download/LexiaPlayer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lexia Player (dernière version)
          body: "APK compilé depuis le commit ${{ github.sha }}. Installez LexiaPlayer.apk sur la Fire TV (appli Downloader ou adb)."
          make_latest: true
          files: LexiaPlayer.apk
