name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Clé de signature définitive (facultative) : secrets du dépôt GitHub.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        run: ./gradlew assembleDirectRelease assembleAmazonRelease --stacktrace
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/direct/release/app-direct-release.apk LexiaPlayer.apk
          cp app/build/outputs/apk/amazon/release/app-amazon-release.apk AlfTVPro-amazon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            LexiaPlayer.apk
            AlfTVPro-amazon.apk
      # Lien fixe pour Downloader : https://github.com/<owner>/<repo>/releases/latest/download/LexiaPlayer.apk
      # AlfTVPro-amazon.apk est le fichier à envoyer sur la console développeur Amazon.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Alf TV Pro IPTV (dernière version)
          body: |
            Compilé depuis le commit ${{ github.sha }}.
            - LexiaPlayer.apk : version à installer directement (Downloader), sans achat.
            - AlfTVPro-amazon.apk : version pour l'Amazon Appstore (essai 7 jours + déblocage).
          make_latest: true
          files: |
            LexiaPlayer.apk
            AlfTVPro-amazon.apk
